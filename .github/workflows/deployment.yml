name: deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST}}
          username: ${{ secrets.DROPLET_USERNAME}}
          password: ${{ secrets.DROPLET_PASSWORD}}
          port: 22
          source: "."
          target: "/root/nodeapplications/netia"

      - name: Execute deployment script via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME}}
          password: ${{ secrets.DROPLET_PASSWORD}}
          port: 22
          script: |
            # Set variables
            APP_NAME="netia"
            APP_DIR="/root/nodeapplications/$APP_NAME"

            echo "Deploying $APP_NAME to $APP_DIR"

            # Ensure Node.js 20+ is installed
            if ! command -v node &> /dev/null || [ "$(node -v | cut -d. -f1 | tr -d 'v')" -lt 20 ]; then
                echo "Node.js 20+ required. Installing/upgrading Node.js..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
            else
                echo "Node.js version is compatible: $(node --version)"
            fi

            # Check if npm is installed
            if ! command -v npm &> /dev/null; then
                echo "npm not found. Installing npm..."
                sudo apt-get install -y npm
            else
                echo "npm is already installed: $(npm --version)"
            fi

            # Check if PM2 is installed
            if ! command -v pm2 &> /dev/null; then
                echo "pm2 not found. Installing pm2 globally..."
                npm install -g pm2
            else
                echo "pm2 is already installed: $(pm2 -v)"
            fi

            # Navigate to app directory, install and build
            cd $APP_DIR
            if [ -f "package.json" ]; then
                echo "Installing dependencies..."
                npm install

                echo "Building application..."
                npm run build

                # Ensure PocketBase Linux binary is executable
                if [ -f "pocketbase/pocketbase" ]; then
                    chmod +x pocketbase/pocketbase
                    ln -sf "$APP_DIR/pocketbase/pocketbase" /usr/local/bin/pocketbase || true
                fi

                # Run or restart with PM2
                if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
                    echo "PM2 process '$APP_NAME' found. Restarting..."
                    pm2 restart "$APP_NAME" --update-env
                else
                    echo "PM2 process '$APP_NAME' not found. Starting with PM2..."
                    pm2 start npm --name "$APP_NAME" -- run start
                fi

                # Save PM2 state across server reboots
                pm2 save
            else
                echo "No package.json found, skipping build & PM2 launch"
            fi

            echo "Deployment complete for $APP_NAME!"
